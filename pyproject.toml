[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bopmux"
version = "0.1.0"
description = "Sound visualizer for tmux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "libtmux>=0.58.0",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
]

[project.scripts]
visualizer-command = "visualizer.main:run"
runner-command = "runner.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/visualizer", "src/runner"]
